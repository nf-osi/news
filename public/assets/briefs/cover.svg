<!-- Generic cover for research briefs: it stands in for any brief, so it says
     "a document with figures" in the abstract rather than depicting one —
     a plotted figure panel under the NF mark's bubbles, on the portal's
     primary gradient. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="630" viewBox="0 0 1300 630" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="630" x2="1300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#002637"/>
      <stop offset="1" stop-color="#125e81"/>
    </linearGradient>
  </defs>

  <rect width="1300" height="630" fill="url(#bg)"/>

  <!-- Figure panel: axes and a short series. -->
  <rect x="110" y="130" width="640" height="390" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M190 190v250h480"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.3">
    <rect x="228" y="330" width="72" height="110"/>
    <rect x="336" y="272" width="72" height="168"/>
    <rect x="552" y="238" width="72" height="202"/>
  </g>
  <rect x="444" y="196" width="72" height="244" fill="#84bd41" fill-opacity="0.85"/>

  <!-- The wordmark's bubbles. -->
  <g fill="none" stroke-width="3">
    <circle cx="1010" cy="345" r="185" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="1152" cy="178" r="62" stroke="#1fa0db" stroke-opacity="0.85"/>
    <circle cx="1244" cy="98" r="30" stroke="#84bd41" stroke-opacity="0.75"/>
  </g>
</svg>
